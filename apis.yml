aid: renew-financial
name: Renew Financial
description: 'Renew Financial (Renew Financial Group LLC) is a specialty consumer
  finance company founded in 2008 and headquartered in Oakland, California that
  pioneered and administers Property Assessed Clean Energy (PACE) financing for
  residential energy efficiency, renewable energy, water efficiency and resiliency
  home improvements. It administers the CaliforniaFIRST program in California and
  RenewPACE in Florida, funding solar, HVAC, roofing, windows, landscaping,
  hurricane and seismic projects through a voluntary property tax assessment repaid
  over terms up to 30 years. The company is licensed by the California Department of
  Financial Protection and Innovation as a PACE Program Administrator (#60DBO-90653)
  and carries NMLS ID 1788120. Renew Financial runs a contractor technology platform
  and an online homeowner application, but publishes no public developer program,
  API documentation, SDK or machine-readable API contract.'
